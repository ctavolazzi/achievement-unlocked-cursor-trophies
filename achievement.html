<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievement Unlocked!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .achievement {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 50%, #1a1a1a 100%);
            border: 2px solid #4a4a4a;
            border-radius: 12px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            min-width: 380px;
            max-width: 500px;
            transform: scale(0.8) translateY(50px);
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
        }
        @keyframes popIn {
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #107c10 0%, #0e6b0e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(16,124,16,0.5);
            animation: iconPulse 2s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(16,124,16,0.5); }
            50% { box-shadow: 0 4px 32px rgba(16,124,16,0.8); }
        }
        .icon svg { width: 36px; height: 36px; fill: white; }
        .content { flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .label { color: #107c10; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .score { color: #888; font-size: 14px; font-weight: 600; }
        .title { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .desc { color: #999; font-size: 13px; }
        .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #107c10;
            border-radius: 50%;
            animation: particleFly 1.5s ease-out forwards;
        }
        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="achievement">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <div class="content">
            <div class="header">
                <span class="label">Achievement Unlocked</span>
                <span class="score" id="score">50G</span>
            </div>
            <div class="title" id="title">Nice Work!</div>
            <div class="desc" id="desc"></div>
        </div>
    </div>
    <script>
        // Parse URL params
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'Achievement Unlocked';
        const score = params.get('score') || '50';
        const desc = params.get('desc') || params.get('description') || '';

        document.getElementById('title').textContent = title;
        document.getElementById('score').textContent = score + 'G';
        document.getElementById('desc').textContent = desc;
        if (!desc) document.getElementById('desc').style.display = 'none';
        document.title = title + ' - Achievement Unlocked!';

        // Play sound
        const sound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2JkZeLgHRtbnuHj5KQiH91cHN+h4+QjoV8dXV4gYiNjouEfHd2eYGHi42LhX55eHmAhYmLioaDfnp5eoGFiImIhYJ+enp7gIWHiIeFgn98e3t/goWGhoSCf3x7e36Bg4SFhIKAfXx7fX+BgoODgoB+fHt8fX+AgoKCgX9+fHt8fX5/gIGBgH9+fXx8fH1+f4CAgH9+fXx8fH1+fn9/f39+fXx8fH1+fn5/f39+fX18fHx9fn5+f39/fn19fHx8fX19fn5+fn5+fX19fHx9fX19fn5+fn59fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19');
        sound.volume = 0.4;
        sound.play().catch(() => {});

        // Particles
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = '50%';
            p.style.top = '50%';
            p.style.setProperty('--tx', (Math.random() - 0.5) * 400 + 'px');
            p.style.setProperty('--ty', (Math.random() - 0.5) * 400 + 'px');
            p.style.animationDelay = Math.random() * 0.3 + 's';
            p.style.background = ['#107c10', '#2ecc71', '#27ae60', '#1abc9c'][Math.floor(Math.random() * 4)];
            container.appendChild(p);
        }

        // Auto-close after 5 seconds (optional)
        // setTimeout(() => window.close(), 5000);
    </script>
</body>
</html>
